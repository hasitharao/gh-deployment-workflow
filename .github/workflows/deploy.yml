name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but don't kill one that's in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Publish only what belongs on the site, not README.md etc.
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
